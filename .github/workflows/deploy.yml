name: Check KK Trip CMS

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  check-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.9.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @flare-cms/blog lint
      - run: pnpm --filter @flare-cms/blog test
      - run: pnpm --filter @flare-cms/blog seed:validate
      - run: pnpm --filter @flare-cms/blog check
      - run: pnpm --filter @flare-cms/blog build
